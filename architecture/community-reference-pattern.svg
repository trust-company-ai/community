<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="1280" role="img" aria-label="Reference architecture: staff and identity provider on the left, the firm's own tenant in the centre with web app, gateway, orchestration, model, secrets, audit trail and scheduler, human review and a named cross-region exception on the right, read-only systems of record below." style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"></path></marker><marker id="arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 z" fill="#374151"></path></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b3722a"></path></marker><marker id="arrow-amber-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 z" fill="#b3722a"></path></marker></defs><g><rect x="8" y="44" width="118" height="54" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="67" y="64" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Trust company staff</text><text x="67" y="74" text-anchor="middle" font-size="7.6" fill="#6b7280">Browser only; nothing installed</text><text x="67" y="84" text-anchor="middle" font-size="7.6" fill="#6b7280">Existing corporate identity</text></g><g><rect x="8" y="132" width="118" height="48" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="67" y="149" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Company identity provider</text><text x="67" y="159" text-anchor="middle" font-size="7.6" fill="#6b7280">Single sign-on, MFA enforced</text><text x="67" y="169" text-anchor="middle" font-size="7.6" fill="#6b7280">No separate AI logins</text></g><path d="M67,98 L67,132" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)" marker-start="url(#arrow-start)"></path><text x="72" y="118" text-anchor="start" font-size="6.8" fill="#6b7280">sign-in</text><g><rect x="140" y="14" width="330" height="296" rx="6" fill="#f4f8f6" stroke="#2f6b4f" stroke-width="1.2"></rect><text x="305" y="27" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2f6b4f" letter-spacing="0.6">THE FIRM'S OWN TENANT AND REGION</text><text x="305" y="37" text-anchor="middle" font-size="7.2" fill="#6b7280">Client data stays here. Retrieval, not training. Nothing leaves without approval.</text></g><g><rect x="156" y="48" width="140" height="44" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="226" y="63" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Web app</text><text x="226" y="73" text-anchor="middle" font-size="7.6" fill="#6b7280">Chat interface for staff</text><text x="226" y="83" text-anchor="middle" font-size="7.6" fill="#6b7280">Source-cited answers</text></g><g><rect x="156" y="112" width="140" height="40" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="226" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">API gateway</text><text x="226" y="140" text-anchor="middle" font-size="7.6" fill="#6b7280">Authenticated calls only</text></g><g><rect x="156" y="170" width="140" height="56" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="226" y="186" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Orchestration</text><text x="226" y="196" text-anchor="middle" font-size="7.6" fill="#6b7280">Reads source systems, read-only</text><text x="226" y="206" text-anchor="middle" font-size="7.6" fill="#6b7280">Assembles the answer or draft</text><text x="226" y="216" text-anchor="middle" font-size="7.6" fill="#6b7280">Every output cites its source</text></g><g><rect x="156" y="246" width="140" height="44" rx="4" fill="#f1f3f5" stroke="#9ca3af" stroke-width="1"></rect><text x="226" y="261" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Scheduler</text><text x="226" y="271" text-anchor="middle" font-size="7.6" fill="#6b7280">Scheduled jobs: report drafts,</text><text x="226" y="281" text-anchor="middle" font-size="7.6" fill="#6b7280">screening exports (no model)</text></g><g><rect x="316" y="48" width="140" height="44" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="386" y="63" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Secrets store</text><text x="386" y="73" text-anchor="middle" font-size="7.6" fill="#6b7280">Keys and credentials</text><text x="386" y="83" text-anchor="middle" font-size="7.6" fill="#6b7280">Least privilege</text></g><g><rect x="316" y="112" width="140" height="40" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="386" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Audit trail (immutable)</text><text x="386" y="140" text-anchor="middle" font-size="7.6" fill="#6b7280">Who asked what, when; outputs kept</text></g><g><rect x="316" y="170" width="140" height="56" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="386" y="186" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Model</text><text x="386" y="196" text-anchor="middle" font-size="7.6" fill="#6b7280">Users never call it directly</text><text x="386" y="206" text-anchor="middle" font-size="7.6" fill="#6b7280">Model choice is a setting</text><text x="386" y="216" text-anchor="middle" font-size="7.6" fill="#6b7280">No training on the firm's data</text></g><path d="M126,71 L156,71" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><text x="141" y="64" text-anchor="middle" font-size="6.8" fill="#6b7280">https</text><path d="M126,156 L156,90" fill="none" stroke="#374151" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow)"></path><path d="M226,92 L226,112" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M226,152 L226,170" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M296,132 L316,132" fill="none" stroke="#374151" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow)"></path><text x="306" y="128" text-anchor="middle" font-size="6.8" fill="#6b7280">logs</text><path d="M296,186 L316,186" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M316,212 L296,212" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M226,246 L226,226" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M386,152 L386,170" fill="none" stroke="#374151" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow)"></path><g><rect x="490" y="150" width="140" height="70" rx="4" fill="#f1f3f5" stroke="#9ca3af" stroke-width="1"></rect><text x="560" y="173" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Human review</text><text x="560" y="183" text-anchor="middle" font-size="7.6" fill="#6b7280">Where AI output meets a decision,</text><text x="560" y="193" text-anchor="middle" font-size="7.6" fill="#6b7280">a named person decides.</text><text x="560" y="203" text-anchor="middle" font-size="7.6" fill="#6b7280">Nothing reaches a client unreviewed.</text></g><path d="M456,186 L490,186" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><g><rect x="490" y="240" width="140" height="60" rx="4" fill="#fdf7ee" stroke="#b3722a" stroke-width="1.2" stroke-dasharray="4 3"></rect><text x="560" y="258" text-anchor="middle" font-size="9" font-weight="600" fill="#b3722a">Cross-region inference</text><text x="560" y="268" text-anchor="middle" font-size="7.6" fill="#b3722a">Named exception: documented,</text><text x="560" y="278" text-anchor="middle" font-size="7.6" fill="#b3722a">risk-accepted, drawn in amber</text><text x="560" y="288" text-anchor="middle" font-size="7.6" fill="#b3722a">Encrypted in transit; nothing stored</text></g><path d="M456,214 L490,262" fill="none" stroke="#b3722a" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-amber)"></path><path d="M226,290 L226,334" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><text x="231" y="322" text-anchor="start" font-size="6.8" fill="#6b7280">read-only</text><g><rect x="140" y="334" width="490" height="58" rx="6" fill="#f4f8f6" stroke="#2f6b4f" stroke-width="1.2"></rect><text x="385" y="347" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2f6b4f" letter-spacing="0.6">SYSTEMS OF RECORD  ·  read-only; nothing written back</text></g><g><rect x="150" y="354" width="112" height="30" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="206" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Client and matter records</text></g><g><rect x="272" y="354" width="112" height="30" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="328" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Document management</text></g><g><rect x="394" y="354" width="112" height="30" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="450" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Trust accounting</text></g><g><rect x="516" y="354" width="106" height="30" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="569" y="372" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Estate administration</text></g><g><path d="M8,262 L36,262" stroke="#374151" stroke-width="1.1" fill="none" marker-end="url(#arrow)"></path><text x="40" y="264" text-anchor="start" font-size="6.8" fill="#6b7280">data flow</text><path d="M8,278 L36,278" stroke="#374151" stroke-width="1.1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"></path><text x="40" y="280" text-anchor="start" font-size="6.8" fill="#6b7280">sign-in / logging</text><path d="M8,294 L36,294" stroke="#b3722a" stroke-width="1.1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-amber)"></path><text x="40" y="296" text-anchor="start" font-size="6.8" fill="#6b7280">named exception</text></g></svg>