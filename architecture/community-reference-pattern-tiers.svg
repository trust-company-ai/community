<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="1280" role="img" aria-label="Use-case tiers by consequence, from internal work with no client data through drafting, decision-adjacent, regulatory with no model, to prohibited; a named exception is drawn in amber." style="font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"></path></marker><marker id="arrow-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 z" fill="#374151"></path></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b3722a"></path></marker><marker id="arrow-amber-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 z" fill="#b3722a"></path></marker></defs><g><rect x="6" y="6" width="628" height="114" rx="6" fill="#f4f8f6" stroke="#2f6b4f" stroke-width="1.2"></rect><text x="320" y="19" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2f6b4f" letter-spacing="0.6">MORE HUMAN JUDGMENT AS CONSEQUENCE RISES</text><text x="320" y="29" text-anchor="middle" font-size="7.2" fill="#6b7280">Route work by consequence, not by capability. The higher the stakes, the more human judgment stays in the loop.</text></g><g><rect x="18" y="34" width="112" height="66" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="74" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Tier 0 · Internal</text><text x="74" y="65" text-anchor="middle" font-size="7.6" fill="#6b7280">No client data</text><text x="74" y="75" text-anchor="middle" font-size="7.6" fill="#6b7280">Policies, public guidance,</text><text x="74" y="85" text-anchor="middle" font-size="7.6" fill="#6b7280">helpdesk</text></g><g><rect x="142" y="34" width="112" height="66" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect><text x="198" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Tier 1 · Drafting only</text><text x="198" y="65" text-anchor="middle" font-size="7.6" fill="#6b7280">Client data; output labelled</text><text x="198" y="75" text-anchor="middle" font-size="7.6" fill="#6b7280">as a draft, edited by</text><text x="198" y="85" text-anchor="middle" font-size="7.6" fill="#6b7280">a professional</text></g><g><rect x="266" y="34" width="112" height="66" rx="4" fill="#f1f3f5" stroke="#9ca3af" stroke-width="1"></rect><text x="322" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Tier 2 · Decision-adjacent</text><text x="322" y="65" text-anchor="middle" font-size="7.6" fill="#6b7280">One input; a named</text><text x="322" y="75" text-anchor="middle" font-size="7.6" fill="#6b7280">decision-maker records</text><text x="322" y="85" text-anchor="middle" font-size="7.6" fill="#6b7280">the reasoning</text></g><g><rect x="390" y="34" width="112" height="66" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"></rect><text x="446" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Regulatory · No model</text><text x="446" y="65" text-anchor="middle" font-size="7.6" fill="#6b7280">Deterministic rules;</text><text x="446" y="75" text-anchor="middle" font-size="7.6" fill="#6b7280">automatic suspension</text><text x="446" y="85" text-anchor="middle" font-size="7.6" fill="#6b7280">on variance</text></g><g><rect x="514" y="34" width="112" height="66" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"></rect><text x="570" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">Prohibited, for now</text><text x="570" y="65" text-anchor="middle" font-size="7.6" fill="#6b7280">Autonomous approvals,</text><text x="570" y="75" text-anchor="middle" font-size="7.6" fill="#6b7280">unattended client contact,</text><text x="570" y="85" text-anchor="middle" font-size="7.6" fill="#6b7280">execution</text></g><path d="M130,67 L142,67" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M254,67 L266,67" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M378,67 L390,67" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><path d="M502,67 L514,67" fill="none" stroke="#374151" stroke-width="1.1" marker-end="url(#arrow)"></path><text x="18" y="114" text-anchor="start" font-size="6.8" fill="#6b7280">← less consequence</text><text x="626" y="114" text-anchor="end" font-size="6.8" fill="#6b7280">more consequence, more human judgment →</text><g><rect x="264" y="130" width="112" height="36" rx="4" fill="#fdf7ee" stroke="#b3722a" stroke-width="1.2" stroke-dasharray="4 3"></rect><text x="320" y="141" text-anchor="middle" font-size="9" font-weight="600" fill="#b3722a">Named exception</text><text x="320" y="151" text-anchor="middle" font-size="7.6" fill="#b3722a">Documented, risk-accepted,</text><text x="320" y="161" text-anchor="middle" font-size="7.6" fill="#b3722a">drawn in amber</text></g><path d="M322,100 L322,130" fill="none" stroke="#b3722a" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrow-amber)"></path></svg>